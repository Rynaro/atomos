# atomos CI — go vet + go test (unit + parity + fence + tool-surface) +
# gofmt + multi-arch build check + the golden drift-guard.
#
# The parity gate lives inside `go test ./...` (internal/compose,
# internal/ecl parity tests assert byte-equality against the committed
# fixtures/parity goldens). The drift-guard step below re-derives those
# goldens from the PROVENANCE-pinned nexus commit and fails the build on any
# diff — a kernel change can never silently break the alternate-surface
# claim (ADR §3.3).
#
# errexit-safety: GitHub runs `run:` under `bash -e`. Intentionally-non-zero
# exit codes are captured with `ec=0; cmd || ec=$?` (a bare `cmd; ec=$?`
# aborts on the intended non-zero before the capture).
name: conformance

on:
  push:
  pull_request:
  # Weekly cron so an upstream eidolons kernel change is caught by the
  # drift guard even when atomos itself isn't being pushed.
  schedule:
    - cron: "23 6 * * 1"

jobs:
  test:
    name: vet + test + fence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      # gofmt gate: the tree must be gofmt-clean. errexit-safe — the command
      # substitution always succeeds, we assert on its (empty) output.
      - name: gofmt gate
        run: |
          dirty="$(gofmt -l .)"
          if [ -n "$dirty" ]; then
            echo "gofmt FAIL — the following files are not gofmt-clean:" >&2
            echo "$dirty" >&2
            echo "Run: gofmt -w <files>" >&2
            exit 1
          fi
          echo "gofmt ok: tree is formatted"

      # go test ./... covers: unit tests, the T1/T2 parity suite
      # (internal/compose, internal/ecl against fixtures/parity), the fence
      # suite (internal/tools: TestToolSurfaceIsExactlyFenced,
      # TestFenceNoForbiddenSurface), and the MCP tool-surface handshake
      # tests (internal/server).
      - name: go test ./...
        run: go test ./... -count=1 -v

  build-check:
    name: multi-arch build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      # Build-only (no push) for both target platforms — catches any
      # cross-compile / distroless-layer regression before release.yml ever
      # runs. Mirrors tonberry's release matrix (linux/amd64 + linux/arm64).
      - name: docker buildx build (amd64 + arm64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

  drift-guard:
    name: golden drift-guard (nexus @ PROVENANCE pin, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS's system bash IS 3.2 — running the drift-guard here EXECUTES
        # the empty-flag-array trap (M8/R9) on a real bash 3.2 instead of
        # merely linting for it. A static lint provably cannot see this
        # class of defect (AC-I12); ubuntu-latest alone let a live v0.1.0
        # defect (regen-goldens.sh aborting on an empty FLAGS array under
        # `set -u`) go uncaught.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: atomos

      - name: Read PROVENANCE-pinned nexus commit
        id: pin
        run: |
          commit="$(grep '^NEXUS_COMMIT=' atomos/fixtures/parity/PROVENANCE | cut -d= -f2)"
          if [ -z "$commit" ] || [ "$commit" = "unknown" ]; then
            echo "::error::fixtures/parity/PROVENANCE has no usable NEXUS_COMMIT pin" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout eidolons nexus @ pinned commit (READ-ONLY oracle)
        uses: actions/checkout@v4
        with:
          repository: Rynaro/eidolons
          ref: ${{ steps.pin.outputs.commit }}
          path: eidolons

      - name: Ensure jq present
        run: |
          command -v jq >/dev/null 2>&1 && exit 0
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y jq
          elif command -v brew >/dev/null 2>&1; then
            brew install jq
          fi

      - name: Re-derive goldens and check for drift (incl. untracked goldens)
        env:
          EIDOLONS_NEXUS: ${{ github.workspace }}/eidolons
        working-directory: atomos
        run: |
          bash scripts/regen-goldens.sh
          # AC-I09: git status --porcelain --untracked-files=all over BOTH
          # fixture trees, not git diff --exit-code — the latter is blind to
          # an untracked golden the executor forgot to `git add`, and v0.2
          # adds an entirely new tree (fixtures/parity-manifest/), which is
          # exactly where that failure mode would land silently.
          dirty="$(git status --porcelain --untracked-files=all fixtures/parity fixtures/parity-manifest)"
          if [ -n "$dirty" ]; then
            echo "::error title=parity drift::fixtures/parity or fixtures/parity-manifest drifted (or gained untracked files) against the PROVENANCE-pinned nexus commit — the kernel oracle changed. Bump the pin deliberately (re-run regen-goldens.sh, review the diff, commit) — never silently." >&2
            echo "$dirty" >&2
            exit 1
          fi
          echo "drift-guard ok: fixtures/parity + fixtures/parity-manifest match the pinned nexus commit (${{ matrix.os }})"

  # ── drift-guard-main — closes Rynaro/atomos#5 ────────────────────────────
  #
  # drift-guard (above) re-derives goldens from the commit PINNED in
  # PROVENANCE. That pin is a constant, so drift-guard is REPRODUCIBLE
  # (same inputs -> same verdict, every run) but is structurally incapable
  # of catching an upstream eidolons kernel change on its own — the weekly
  # `schedule:` trigger was re-running the identical comparison against the
  # identical frozen kernel for a month (#5: the pin sat at v2.7.0, 80
  # commits behind, while conformance stayed green throughout).
  #
  # This job re-derives the SAME goldens against `Rynaro/eidolons` **main**
  # (unpinned, moving) instead of the PROVENANCE commit. It is what actually
  # earns the cron: a real kernel behaviour change lands here on the very
  # next scheduled run, not "whenever someone remembers to advance the pin".
  #
  # ADVISORY, not required (continue-on-error) — stated reasoning, not a
  # default: `scripts/regen-goldens.sh`'s `strip_volatile()` deliberately
  # does NOT strip `.from.version` (envelope.json) / `.from_version`
  # (input.json) — correct for a same-version comparison (drift-guard
  # above), but nexus's own VERSION file advances on nearly every nexus
  # release, independent of any actual kernel BEHAVIOUR change (this is
  # exactly what made #5's goldens go stale in the first place: the only
  # diff across 80 commits was that one field). A REQUIRED job wired to a
  # moving `main` would therefore go red on most routine nexus releases —
  # not because atomos broke, but because the version string advanced. That
  # is precisely the "gate that fires on noise, gets silenced, then misses
  # the real thing" failure mode this campaign exists to avoid. Advisory
  # keeps the signal visible (a human reviewing this job's log sees exactly
  # which fields drifted and can tell a version-only bump from genuine
  # semantic drift at a glance — the SHA-256/`sha256`/`integrity.value`
  # fields staying identical is the tell) without making every unrelated
  # nexus release into a required-check failure atomos's own PRs would have
  # to work around. If false-positive fatigue turns out not to be the
  # dominant case in practice, flipping this to required is a one-line
  # change (drop `continue-on-error`).
  drift-guard-main:
    name: golden drift-guard (nexus @ main, ADVISORY, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: atomos

      - name: Checkout eidolons nexus @ main (READ-ONLY oracle, UNPINNED)
        uses: actions/checkout@v4
        with:
          repository: Rynaro/eidolons
          ref: main
          path: eidolons

      - name: Ensure jq present
        run: |
          command -v jq >/dev/null 2>&1 && exit 0
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y jq
          elif command -v brew >/dev/null 2>&1; then
            brew install jq
          fi

      - name: Re-derive goldens against nexus main and report drift (non-blocking)
        env:
          EIDOLONS_NEXUS: ${{ github.workspace }}/eidolons
        working-directory: atomos
        run: |
          bash scripts/regen-goldens.sh
          dirty="$(git status --porcelain --untracked-files=all fixtures/parity fixtures/parity-manifest)"
          if [ -n "$dirty" ]; then
            echo "::warning title=parity drift vs nexus main::fixtures/parity or fixtures/parity-manifest drifted against Rynaro/eidolons main (advisory — see the job's own header comment in conformance.yml for why this leg does not block). Check whether ONLY from.version/from_version/timestamp fields changed (routine nexus release, no action needed) or whether a sha256/integrity.value ALSO changed (genuine kernel drift — investigate and, once confirmed benign or fixed upstream, advance drift-guard's PROVENANCE pin in a dedicated PR)." >&2
            echo "$dirty" >&2
            exit 0
          fi
          echo "drift-guard-main ok: fixtures/parity + fixtures/parity-manifest match nexus main exactly (${{ matrix.os }})"
